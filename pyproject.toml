[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-wake"
version = "0.22.0.dev38"
description = "Durable Codex follow-ups, tracked agent exchanges and MCP tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Cochran Research Group" }
]
dependencies = [
  "dbus-next>=0.2.3,<0.3",
  "websockets>=17,<18",
  "jsonschema>=4.26,<5",
  "msgspec>=0.22,<0.23",
]

[project.scripts]
codex-wake = "codex_wake.entrypoint:main"
codex-profiles = "codex_wake.profile_compat:main"
codex-profile = "codex_wake.profile_compat:profile_main"
codex-stock = "codex_wake.profile_compat:stock_main"
codex-modded = "codex_wake.profile_compat:modded_main"
codex-waked = "codex_wake.daemon:main"
codex-wake-hook = "codex_wake.hook:main"
codex-wake-github-webhook = "codex_wake.webhook_listener:main"
codex-wake-mcp = "codex_wake.mcp_server:main"

[project.optional-dependencies]
mcp = ["mcp>=2.2,<2.3"]
dev = ["ruff==0.14.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_wake = ["time_collect.ps1"]
codex_profiles = ["LICENSE"]
